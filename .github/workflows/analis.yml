name: analis-1h

on:
  schedule:
    # Setiap 1 jam (menit ke-0, UTC)
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # perlu untuk menyimpan state & riwayat trade ke repo

concurrency:
  group: analis
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Jalankan analis
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analis.py

      - name: Simpan state dan riwayat trade
        if: always()
        run: |
          git config user.name "analis-bot"
          git config user.email "analis-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data"
          else
            git commit -m "update state $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      - name: Simpan hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-analisis
          path: results/
          retention-days: 14
